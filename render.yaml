services:
  - type: web
    name: puente-agent
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn puente.server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PUENTE_MOCK
        value: "0"
      - key: FX_URL
        value: https://ve.dolarapi.com/v1/dolares/paralelo
      - key: FX_JSON_PATH
        value: promedio
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
