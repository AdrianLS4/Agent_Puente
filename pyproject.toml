[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puente-agent"
version = "0.1.0"
description = "PUENTE: agente de compras en USD para venezolanos sobre PayPal Agent Toolkit"
requires-python = ">=3.10"
dependencies = [
  "paypal-agent-toolkit>=1.1.0",
  "openai-agents",
  "pydantic>=2",
  "httpx",
  "python-dotenv",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
